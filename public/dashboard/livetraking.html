        <script type="module">

            import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
            import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

            const deviceId = localStorage.getItem("deviceId"); // ✅ Change 'const' to 'let'
            let usernametag = localStorage.getItem("username");
            document.getElementById("device-id").textContent = deviceId || "No device selected";


            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            const userId = deviceId;

            console.log(usernametag);
            let map = L.map('map').setView([0, 0], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            let marker = L.marker([0, 0]).addTo(map);
            let trackingActive = false;
            let startTime = null, endTime = null, totalDistance = 0, totalDuration = 0, movingDuration = 0, topSpeed = 0;
            let path = [];
            let polyline = L.polyline([], { color: 'red' }).addTo(map);
            let lastBearing = null;
            const minDistanceThreshold = 10; // Minimum distance (meters) between saved points
            console.log(userId);

            const userRef = ref(db, `${userId}/tracking`);
            onValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    console.log("fdsf");
                    let newPos = [data.latitude, data.longitude];
                    console.log(data);
                    marker.setLatLng(newPos);
                    map.setView(newPos);


                }
            });
        </script>
