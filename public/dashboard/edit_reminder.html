    <main>
        <div class="addreminder">
            <h1>Add New Reminder</h1>
        <div class="content">
    <div class="form-container">
        <form id="reminderForm">
            <label for="title">Title:</label>
            <select id="title" name="title" onchange="handleTitleChange()">
                <option value="">Select a reminder type</option>
                <option value="Service Vehicle">Service Vehicle</option>
                <option value="Tire Change">Tire Change</option>
                <option value="Engine Check">Engine Check</option>
                <option value="Oil Change">Oil Change</option>
                <option value="Brake Inspection">Brake Inspection</option>
                <option value="Custom">Custom</option>
            </select>
            <input type="text" id="customTitle" name="customTitle" placeholder="Enter custom title" style="display: none;">
    
            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="4" placeholder="Enter a brief description"></textarea>
    
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
    
            <label for="startTime">Start Time:</label>
            <input type="time" id="startTime" name="startTime" required>
    
            <label>Choose a Color:</label>
            <div class="color-options">
                <div class="color-option" data-color="#007bff" style="background-color: #007bff;"></div>
                <div class="color-option" data-color="#28a745" style="background-color: #28a745;"></div>
                <div class="color-option" data-color="#dc3545" style="background-color: #dc3545;"></div>
                <div class="color-option" data-color="#ffc107" style="background-color: #ffc107;"></div>
                <div class="color-option" data-color="#17a2b8" style="background-color: #17a2b8;"></div>
            </div>
            <input type="hidden" id="color" name="color" value="#007bff">
    
            <button type="submit">Update Reminder</button>
        </form>
    </div>
        </div>
        </div>
    <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
            import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

           // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Initialize Firestore
        const db = firebase.firestore();

        const reminderId = new URLSearchParams(window.location.search).get("id");
        const deviceId = localStorage.getItem("deviceId");


         // Handle color selection
         const colorOptions = document.querySelectorAll(".color-option");
            const colorInput = document.getElementById("color");

            colorOptions.forEach((option) => {
                option.addEventListener("click", () => {
                    // Remove selected class from all options
                    colorOptions.forEach((opt) => opt.classList.remove("selected"));
                    // Add selected class to the clicked option
                    option.classList.add("selected");
                    // Update the hidden input value
                    colorInput.value = option.getAttribute("data-color");
                });
            });

        // Load reminder data
        db.doc(`devices/${deviceId}/reminders/${reminderId}`).get().then((doc) => {
            const data = doc.data();
            document.getElementById("title").value = data.title;
            document.getElementById("description").value = data.description;
            document.getElementById("date").value = data.date;
            document.getElementById("startTime").value = data.startTime;
            document.getElementById("color").value = data.color;
        });

        // Update reminder
        document.getElementById("reminderForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const updatedData = {
                title: document.getElementById("title").value,
                description: document.getElementById("description").value,
                date: document.getElementById("date").value,
                startTime: document.getElementById("startTime").value,
                color: document.getElementById("color").value,
            };

            await db.doc(`devices/${deviceId}/reminders/${reminderId}`).update(updatedData);
            window.location.href = "reminders.html"; // Redirect back to reminders page
        });
    </script>
