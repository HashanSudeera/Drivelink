<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Registration</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.8.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Blur Overlay -->
    <div id="blurOverlay" class="blur-overlay"></div>
    <div id="toast" class="toast">
        <span id="toastMessage">DriveLink</span>
    </div>

    <div class="register-container">
        <h1>DriveLink</h1>
        <h2>Complete Your Registration</h2>
        <form id="google-register-form">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="text" id="device-id" placeholder="Device ID" required>
            </div>
            <div class="form-group">
                <select id="vehicle-type">
                    <option value="dio">Dio</option>
                    <option value="ct100">CT100</option>
                    <option value="fz">FZ</option>
                </select>

            </div>

            <div class="form-group">
                <input type="number" id="mileage" placeholder="Mileage (km)" required>
            </div>


        </form>
        <div class="form-group">
            <button id="complete-registration-button">Complete Registration</button>
        </div>
        <h4>©Team TeraNode</h4>
    </div>
</body>

</html>
